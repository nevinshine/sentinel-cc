name: Benchmark Suite
on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev lld libbpf-dev libelf-dev \
            libssl-dev libkeyutils-dev cmake make \
            nginx redis-server redis-tools libsqlite3-dev libseccomp-dev
          # Detect clang's LLVM major version so pass + compiler stay in sync
          CLANG_MAJOR=$(clang -dumpversion | cut -d. -f1)
          echo "Detected clang major version: ${CLANG_MAJOR}"
          sudo apt-get install -y "llvm-${CLANG_MAJOR}-dev" 2>/dev/null || true
          echo "LLVM_VER=${CLANG_MAJOR}" >> "$GITHUB_ENV"
          # bpftool — test actual BTF dump (not just bpftool version which broken wrappers pass)
          KVER=$(uname -r)
          sudo apt-get install -y "linux-tools-${KVER}" 2>/dev/null \
            || sudo apt-get install -y linux-tools-azure 2>/dev/null \
            || sudo apt-get install -y linux-tools-generic 2>/dev/null \
            || true
          if [ -f /sys/kernel/btf/vmlinux ]; then
            if ! bpftool btf dump file /sys/kernel/btf/vmlinux format c > /dev/null 2>&1; then
              echo "Package bpftool cannot dump BTF, building from source..."
              sudo apt-get install -y git libcap-dev 2>/dev/null || true
              git clone --recurse-submodules --depth 1 https://github.com/libbpf/bpftool.git /tmp/bpftool
              cd /tmp/bpftool/src && make -j$(nproc) && sudo cp bpftool /usr/local/bin/
              cd -
              hash -r
              echo "Source-built bpftool: $(bpftool version 2>&1)"
            fi
          fi
          # wrk
          if ! command -v wrk &>/dev/null; then
            sudo apt-get install -y wrk 2>/dev/null || (
              sudo apt-get install -y libssl-dev
              git clone --depth 1 https://github.com/wg/wrk.git /tmp/wrk
              cd /tmp/wrk && make -j$(nproc) WITH_OPENSSL=/usr && sudo cp wrk /usr/local/bin/
            ) || echo "::warning::wrk not available"
          fi

      - name: Generate vmlinux.h
        run: |
          BTF=false
          if [ -f /sys/kernel/btf/vmlinux ]; then
            # bpftool wrapper may exist but fail for the running kernel
            if bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h.tmp 2>/dev/null; then
              if [ -s vmlinux.h.tmp ] && grep -q 'typedef.*__u64' vmlinux.h.tmp; then
                mv vmlinux.h.tmp vmlinux.h
                BTF=true
                echo "BTF + vmlinux.h ✓"
              else
                rm -f vmlinux.h.tmp
                echo "::warning::bpftool produced invalid vmlinux.h"
              fi
            else
              rm -f vmlinux.h.tmp
              echo "::warning::bpftool failed — azure kernel may need linux-tools-azure"
            fi
          fi
          if [ "$BTF" = false ]; then
            echo "::warning::No BTF — BPF compilation and enforcement tests will be skipped"
            # Minimal vmlinux.h so non-BPF build targets don't fail
            printf '%s\n' \
              '#ifndef __VMLINUX_H__' \
              '#define __VMLINUX_H__' \
              'typedef unsigned char __u8;' \
              'typedef unsigned int __u32;' \
              'typedef unsigned long long __u64;' \
              'typedef int __s32;' \
              'typedef long long __s64;' \
              'typedef __u32 pid_t;' \
              'typedef _Bool bool;' \
              'enum { false = 0, true = 1 };' \
              '#endif' > vmlinux.h
          fi
          echo "BTF_OK=$BTF" >> "$GITHUB_ENV"

      - name: Build Sentinel-CC
        run: |
          # Build SentinelPass against the correct LLVM version (must match clang)
          rm -f src/compiler/build/CMakeCache.txt
          mkdir -p src/compiler/build
          cd src/compiler/build
          cmake .. -DLLVM_DIR="/usr/lib/llvm-${LLVM_VER}/lib/cmake/llvm"
          make -j$(nproc)
          cd "$GITHUB_WORKSPACE"
          if [ "$BTF_OK" = "true" ]; then
            make -j$(nproc)
          else
            make -j$(nproc) sign_tool keys
          fi

      - name: Build benchmarks & attacks
        timeout-minutes: 15
        run: |
          make -j$(nproc) victim_bench attacks
          clang -fpass-plugin=src/compiler/build/SentinelPass.so -O2 \
            benchmarks/sqlite_bench.c -lsqlite3 -o benchmarks/sqlite_bench
          ./sign_tool benchmarks/sqlite_bench priv.pem
          cc -O2 eval/landlock_harness.c -o eval/landlock_harness 2>/dev/null || true
          cc -O2 eval/seccomp_harness.c -lseccomp -o eval/seccomp_harness 2>/dev/null || true

      - name: Setup keyring
        if: env.BTF_OK == 'true'
        run: |
          sudo keyctl add user sentinel:pubkey "$(cat pub.pem)" @s
          sudo keyctl setperm $(keyctl search @s user sentinel:pubkey) 0x3f3f3f3f

      - name: "Benchmark 1: Syscall Latency (microbenchmark)"
        if: env.BTF_OK == 'true'
        run: sudo ./benchmark.sh 2>&1

      # ── Macro Benchmarks ──────────────────────────────────────────
      # Each workload in its own step: isolated failures, simple process
      # management, and timeout-minutes can actually kill everything.
      # sudo is used ONLY for BPF loader (needs CAP_BPF).

      - name: "Benchmark 2a: nginx throughput"
        if: env.BTF_OK == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p benchmarks
          CSV=benchmarks/results_macro.csv
          [ -f "$CSV" ] || echo "workload,mode,mean_throughput,stddev,unit" > "$CSV"
          sudo systemctl stop nginx 2>/dev/null || true
          killall nginx 2>/dev/null || true

          # Generate config if needed
          if [ ! -f benchmarks/nginx_bench.conf ]; then
            cat > benchmarks/nginx_bench.conf <<'EOF'
          daemon off;
          worker_processes 1;
          pid /tmp/sentinel_nginx.pid;
          error_log /tmp/sentinel_nginx_err.log;
          events { worker_connections 64; }
          http {
            access_log off;
            server { listen 8765; location / { return 200 "ok\n"; } }
          }
          EOF
          fi

          RUNS=3
          bench_nginx() {
            local mode=$1 results=/tmp/nginx_${mode}.txt
            rm -f "$results"
            for i in $(seq 1 $RUNS); do
              echo "  nginx $mode run $i/$RUNS"
              killall nginx 2>/dev/null || true; sleep 0.2
              nginx -c "$(pwd)/benchmarks/nginx_bench.conf" &
              SRV=$!
              for w in $(seq 1 10); do bash -c "echo >/dev/tcp/127.0.0.1/8765" 2>/dev/null && break; sleep 0.2; done
              rps=$(timeout 10 wrk -t1 -c8 -d2s http://127.0.0.1:8765/ 2>/dev/null | grep 'Requests/sec' | awk '{print $2}')
              echo "${rps:-0}" >> "$results"
              kill $SRV 2>/dev/null; wait $SRV 2>/dev/null || true
              sleep 0.2
            done
            awk '{s+=$1;ss+=$1*$1;n++} END{m=s/n;sd=sqrt((ss/n)-(m*m));printf "%.2f %.2f\n",m,sd}' "$results"
          }

          echo "── nginx native ──"
          NATIVE=$(bench_nginx native)
          echo "── nginx sentinel ──"
          sudo ./loader --system-wide ./victim_phase2 &>/dev/null &
          LOADER=$!
          sleep 2
          SENTINEL=$(bench_nginx sentinel)
          sudo kill $LOADER 2>/dev/null; sudo kill -9 $LOADER 2>/dev/null; wait $LOADER 2>/dev/null || true
          sudo pkill -9 -f './loader' 2>/dev/null || true

          N_MEAN=$(echo "$NATIVE" | awk '{print $1}')
          S_MEAN=$(echo "$SENTINEL" | awk '{print $1}')
          N_SD=$(echo "$NATIVE" | awk '{print $2}')
          S_SD=$(echo "$SENTINEL" | awk '{print $2}')
          echo "nginx,native,$N_MEAN,$N_SD,req/s" >> "$CSV"
          echo "nginx,sentinel,$S_MEAN,$S_SD,req/s" >> "$CSV"
          echo "✓ nginx native: $N_MEAN req/s | sentinel: $S_MEAN req/s"
          killall nginx 2>/dev/null || true

      - name: "Benchmark 2b: Redis throughput"
        if: env.BTF_OK == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          CSV=benchmarks/results_macro.csv
          sudo systemctl stop redis-server 2>/dev/null || true
          killall redis-server 2>/dev/null || true

          RUNS=3
          bench_redis() {
            local mode=$1 results=/tmp/redis_${mode}.txt
            rm -f "$results"
            for i in $(seq 1 $RUNS); do
              echo "  redis $mode run $i/$RUNS"
              killall redis-server 2>/dev/null || true; sleep 0.2
              redis-server --port 7777 --save "" --appendonly no --loglevel warning &
              SRV=$!
              for w in $(seq 1 10); do bash -c "echo >/dev/tcp/127.0.0.1/7777" 2>/dev/null && break; sleep 0.2; done
              ops=$(timeout 15 redis-benchmark -p 7777 -n 10000 -c 10 -P 8 -q 2>/dev/null | grep 'SET:' | awk '{print $2}')
              echo "${ops:-0}" >> "$results"
              kill $SRV 2>/dev/null; wait $SRV 2>/dev/null || true
              sleep 0.2
            done
            awk '{s+=$1;ss+=$1*$1;n++} END{m=s/n;sd=sqrt((ss/n)-(m*m));printf "%.2f %.2f\n",m,sd}' "$results"
          }

          echo "── Redis native ──"
          NATIVE=$(bench_redis native)
          echo "── Redis sentinel ──"
          sudo ./loader --system-wide ./victim_phase2 &>/dev/null &
          LOADER=$!
          sleep 2
          SENTINEL=$(bench_redis sentinel)
          sudo kill $LOADER 2>/dev/null; sudo kill -9 $LOADER 2>/dev/null; wait $LOADER 2>/dev/null || true
          sudo pkill -9 -f './loader' 2>/dev/null || true

          N_MEAN=$(echo "$NATIVE" | awk '{print $1}')
          S_MEAN=$(echo "$SENTINEL" | awk '{print $1}')
          N_SD=$(echo "$NATIVE" | awk '{print $2}')
          S_SD=$(echo "$SENTINEL" | awk '{print $2}')
          echo "redis,native,$N_MEAN,$N_SD,ops/s" >> "$CSV"
          echo "redis,sentinel,$S_MEAN,$S_SD,ops/s" >> "$CSV"
          echo "✓ Redis native: $N_MEAN ops/s | sentinel: $S_MEAN ops/s"
          killall redis-server 2>/dev/null || true

      - name: "Benchmark 2c: SQLite throughput"
        if: env.BTF_OK == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          CSV=benchmarks/results_macro.csv
          if [ ! -x ./benchmarks/sqlite_bench ]; then
            echo "::warning::sqlite_bench not found, skipping"
            exit 0
          fi

          RUNS=3
          echo "── SQLite native ──"
          NATIVE_FILE=/tmp/sqlite_native.txt; rm -f "$NATIVE_FILE"
          for i in $(seq 1 $RUNS); do
            echo "  sqlite native run $i/$RUNS"
            rm -f /tmp/sentinel_bench.db
            ops=$(./benchmarks/sqlite_bench /tmp/sentinel_bench.db 2>&1 | grep 'SQLITE_OPS_PER_SEC=' | cut -d= -f2)
            echo "${ops:-0}" >> "$NATIVE_FILE"
          done

          echo "── SQLite sentinel ──"
          SENTINEL_FILE=/tmp/sqlite_sentinel.txt; rm -f "$SENTINEL_FILE"
          for i in $(seq 1 $RUNS); do
            echo "  sqlite sentinel run $i/$RUNS"
            rm -f /tmp/sentinel_bench.db
            output=$(timeout 30 sudo ./loader ./benchmarks/sqlite_bench /tmp/sentinel_bench.db 2>&1) || true
            ops=$(echo "$output" | grep 'SQLITE_OPS_PER_SEC=' | cut -d= -f2)
            if [ -z "$ops" ] || [ "$ops" = "0" ]; then
              echo "  (loader+sqlite_bench yielded 0, skipping remaining sentinel runs)"
              echo "0" >> "$SENTINEL_FILE"
              break
            fi
            echo "${ops:-0}" >> "$SENTINEL_FILE"
          done

          NATIVE=$(awk '{s+=$1;ss+=$1*$1;n++} END{m=s/n;sd=sqrt((ss/n)-(m*m));printf "%.2f %.2f\n",m,sd}' "$NATIVE_FILE")
          SENTINEL=$(awk '{s+=$1;ss+=$1*$1;n++} END{m=s/n;sd=sqrt((ss/n)-(m*m));printf "%.2f %.2f\n",m,sd}' "$SENTINEL_FILE")
          echo "sqlite,native,$(echo $NATIVE | awk '{print $1}'),$(echo $NATIVE | awk '{print $2}'),ops/s" >> "$CSV"
          echo "sqlite,sentinel,$(echo $SENTINEL | awk '{print $1}'),$(echo $SENTINEL | awk '{print $2}'),ops/s" >> "$CSV"
          echo "✓ SQLite native: $(echo $NATIVE | awk '{print $1}') ops/s | sentinel: $(echo $SENTINEL | awk '{print $1}') ops/s"
          sudo pkill -9 -f './loader' 2>/dev/null || true

      - name: "Benchmark 3: Comparative Evaluation"
        if: env.BTF_OK == 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          chmod +x eval/comparative.sh
          sudo ./eval/comparative.sh 100000 3 2>&1 || true
          sudo pkill -9 -f './loader' 2>/dev/null || true
          sudo pkill -9 -f 'victim' 2>/dev/null || true

      - name: "Red Team Attack Suite"
        if: env.BTF_OK == 'true'
        continue-on-error: true
        run: sudo bash tests/red_team.sh 2>&1

      - name: "Full Test Suite"
        if: env.BTF_OK == 'true'
        continue-on-error: true
        run: sudo make test 2>&1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results_macro.csv
            eval/results_comparative.csv
