name: Benchmark Suite
on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libbpf-dev libelf-dev \
            libssl-dev libkeyutils-dev cmake make linux-tools-common \
            linux-tools-$(uname -r) || true
          # bpftool
          which bpftool || sudo apt-get install -y linux-tools-generic || true
          # wrk
          sudo apt-get install -y wrk || (
            git clone --depth 1 https://github.com/wg/wrk.git /tmp/wrk
            cd /tmp/wrk && make -j$(nproc) WITH_OPENSSL=/usr && sudo cp wrk /usr/local/bin/
          ) || true
          # nginx, redis, sqlite
          sudo apt-get install -y nginx redis-server redis-tools libsqlite3-dev
          # libseccomp
          sudo apt-get install -y libseccomp-dev

      - name: Check BTF
        run: |
          if [ -f /sys/kernel/btf/vmlinux ]; then
            echo "BTF available ✓"
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h
          else
            echo "::warning::BTF not available — BPF enforcement tests will be skipped"
            echo "BTF_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Build Sentinel-CC
        run: make -j$(nproc) 2>&1 | tail -20

      - name: Build benchmarks & attacks
        run: |
          make victim_bench 2>&1 | tail -5
          make attacks 2>&1 | tail -5
          # SQLite bench (instrumented)
          clang -fpass-plugin=src/compiler/build/SentinelPass.so -O2 \
            benchmarks/sqlite_bench.c -lsqlite3 -o benchmarks/sqlite_bench
          ./sign_tool benchmarks/sqlite_bench priv.pem
          # Comparative eval harnesses
          cc -O2 eval/landlock_harness.c -o eval/landlock_harness 2>/dev/null || true
          if pkg-config --exists libseccomp 2>/dev/null; then
            cc -O2 eval/seccomp_harness.c -lseccomp -o eval/seccomp_harness
          fi 2>/dev/null || true

      - name: Setup keyring
        run: |
          sudo keyctl add user sentinel:pubkey "$(cat pub.pem)" @s
          sudo keyctl setperm $(keyctl search @s user sentinel:pubkey) 0x3f3f3f3f

      - name: "Benchmark 1: Syscall Latency (microbenchmark)"
        if: env.BTF_AVAILABLE != 'false'
        run: sudo ./benchmark.sh 2>&1

      - name: "Benchmark 2: Macro Benchmarks (nginx/Redis/SQLite)"
        if: env.BTF_AVAILABLE != 'false'
        run: |
          chmod +x benchmarks/macro_bench.sh
          sudo ./benchmarks/macro_bench.sh 10 2>&1

      - name: "Benchmark 3: Comparative Evaluation"
        if: env.BTF_AVAILABLE != 'false'
        run: |
          chmod +x eval/comparative.sh
          sudo ./eval/comparative.sh 2>&1

      - name: "Red Team Attack Suite"
        if: env.BTF_AVAILABLE != 'false'
        run: sudo bash tests/red_team.sh 2>&1

      - name: "Full Test Suite"
        if: env.BTF_AVAILABLE != 'false'
        run: sudo make test 2>&1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results_macro.csv
            eval/results_comparative.csv
