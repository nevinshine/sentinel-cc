# Sentinel-CC CI Pipeline
# Tier 1: Build + static checks (runs on standard runners)
# Tier 2: Full integration tests (requires self-hosted runner with BTF kernel)

name: Sentinel-CC CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  LLVM_VERSION: 18

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Tier 1: Build & Static Analysis (standard GitHub runner)
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build & Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev \
            libbpf-dev \
            libelf-dev \
            libssl-dev \
            libkeyutils-dev \
            cmake \
            linux-tools-common
          # Create symlinks so Makefile's CLANG=clang and CC=cc resolve
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-${{ env.LLVM_VERSION }} 100
          # Verify the right version is active
          clang --version
          llvm-config --version

      - name: Build Compiler Pass
        run: |
          mkdir -p src/compiler/build
          cd src/compiler/build
          cmake .. -DLLVM_DIR=$(llvm-config --cmakedir)
          make -j$(nproc)
          # Verify the .so was built
          ls -la SentinelPass.so

      - name: Build Signing Tool
        run: make CC=clang sign_tool

      - name: Build sentinel-dump
        run: make sentinel-dump

      - name: Generate Keys
        run: make keys

      - name: Build Victim Binaries
        timeout-minutes: 5
        run: |
          # Build each victim individually for clearer error reporting
          # Pass CLANG explicitly to ensure version match with the pass
          for bin in victim victim_phase2 victim_cfi victim_threaded victim_fork; do
            echo "=== Building $bin ==="
            make CLANG=clang-${{ env.LLVM_VERSION }} "$bin"
          done

      - name: Build Attack Binaries
        timeout-minutes: 5
        run: make CLANG=clang-${{ env.LLVM_VERSION }} attacks

      - name: Verify ELF Sections
        run: |
          echo "=== Checking .sentinel sections ==="
          for bin in victim victim_phase2 victim_cfi victim_threaded victim_fork; do
            if readelf -S "$bin" | grep -q '.sentinel'; then
              echo "✓ $bin has .sentinel"
            else
              echo "✗ $bin MISSING .sentinel" && exit 1
            fi
            if readelf -S "$bin" | grep -q '.signature'; then
              echo "✓ $bin has .signature"
            else
              echo "✗ $bin MISSING .signature" && exit 1
            fi
          done

      - name: Verify .sentinel_imports on dynamic binaries
        run: |
          for bin in victim_phase2 victim_fork; do
            if readelf -S "$bin" | grep -q '.sentinel_imports'; then
              echo "✓ $bin has .sentinel_imports"
            else
              echo "✗ $bin MISSING .sentinel_imports" && exit 1
            fi
          done

      - name: Verify .sentinel_cfi sections
        run: |
          for bin in victim_cfi; do
            if readelf -S "$bin" | grep -q '.sentinel_cfi'; then
              echo "✓ $bin has .sentinel_cfi"
            else
              echo "✗ $bin MISSING .sentinel_cfi" && exit 1
            fi
          done

      - name: Verify CLI Help
        run: |
          ./sign_tool --help | grep -q "Usage" && echo "✓ sign_tool --help"
          ./sign_tool --version | grep -q "Sentinel-CC" && echo "✓ sign_tool --version"

      - name: Script Syntax Check
        run: |
          bash -n tests/run_all.sh && echo "✓ run_all.sh syntax OK"
          bash -n tests/red_team.sh && echo "✓ red_team.sh syntax OK"
          bash -n benchmark.sh && echo "✓ benchmark.sh syntax OK"

      - name: Upload Binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-binaries
          path: |
            victim
            victim_phase2
            victim_cfi
            victim_threaded
            victim_fork
            loader
            sign_tool
            attack_*
            pub.pem
          retention-days: 7
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════
  # Tier 2: Integration Tests (self-hosted runner with BTF kernel)
  # ═══════════════════════════════════════════════════════════════════
  integration:
    name: Integration Tests
    needs: build
    runs-on: [self-hosted, btf-kernel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: sentinel-binaries

      - name: Make Binaries Executable
        run: chmod +x victim* loader sign_tool attack_*

      - name: Build BPF (requires BTF)
        run: |
          # Need vmlinux.h and bpftool on the runner
          make vmlinux.h
          make sentinel.skel.h
          make loader

      - name: Setup Keyring
        run: |
          sudo keyctl add user sentinel:pubkey "$(cat pub.pem)" @s > /dev/null 2>&1
          kid=$(sudo keyctl search @s user sentinel:pubkey 2>/dev/null)
          sudo keyctl setperm "$kid" 0x3f3f3f3f 2>/dev/null || true

      - name: Run Test Suite
        run: sudo tests/run_all.sh

      - name: Run Red Team Suite
        run: sudo tests/red_team.sh

      - name: Run Benchmark
        run: sudo ./benchmark.sh

  # ═══════════════════════════════════════════════════════════════════
  # Tier 3: Multi-Arch Cross-Compilation Check
  # ═══════════════════════════════════════════════════════════════════
  cross-compile:
    name: Cross-Compile (ARM64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 Cross-Compilation Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            cmake
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-${{ env.LLVM_VERSION }} 100

      - name: Build Compiler Pass (host)
        run: |
          mkdir -p src/compiler/build
          cd src/compiler/build
          cmake .. -DLLVM_DIR=$(llvm-config --cmakedir)
          make -j$(nproc)

      - name: Cross-Compile BPF for ARM64
        run: |
          # Verify clang can target aarch64 BPF
          echo "#include <stdint.h>" | clang -target bpf -D__TARGET_ARCH_arm64 -x c -c - -o /dev/null 2>&1 && \
            echo "✓ ARM64 BPF target supported" || \
            echo "⚠ ARM64 BPF target not available (expected on x86-only runners)"

      - name: Cross-Compile Victim (ARM64 syntax check)
        run: |
          # Verify LLVM pass works with ARM64 target (syntax/IR only, not linkable)
          clang-${{ env.LLVM_VERSION }} \
            -fpass-plugin=src/compiler/build/SentinelPass.so \
            --target=aarch64-linux-gnu \
            -O2 -S -emit-llvm \
            tests/victim.c -o /dev/null 2>&1 && \
            echo "✓ SentinelPass works with ARM64 target" || \
            echo "⚠ SentinelPass ARM64 cross-compilation needs work"
